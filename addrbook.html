<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>龙岩二中高2006届8班 · 同学通讯录</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --ink:#1f2933; --sub:#6b7684; --line:#e6eaf0;
    --accent:#2f6fa8; --accent-soft:#eef4fa;
    --teacher:#b07d3f; --teacher-soft:#fbf4e9;
  }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:#eef1f5; color:var(--ink);
    padding:28px 20px 60px; -webkit-font-smoothing:antialiased;
  }
  .page{max-width:1080px;margin:0 auto}

  /* ===== 头部 ===== */
  .hero{
    display:flex;justify-content:space-between;align-items:flex-end;gap:16px;
    padding:26px 30px;border-radius:16px;
    background:linear-gradient(135deg,#2f6fa8,#4a90cc);
    color:#fff;margin-bottom:18px;
    box-shadow:0 8px 24px rgba(47,111,168,.25);
  }
  .hero h1{font-size:24px;font-weight:700;letter-spacing:.5px}
  .hero .sub{font-size:13px;opacity:.88;margin-top:8px;letter-spacing:.3px}
  .btn{
    background:rgba(255,255,255,.16);color:#fff;
    border:1px solid rgba(255,255,255,.45);
    padding:9px 16px;border-radius:9px;font-size:13px;
    cursor:pointer;white-space:nowrap;font-family:inherit;transition:.2s;
  }
  .btn:hover{background:rgba(255,255,255,.3)}

  /* ===== 工具栏 ===== */
  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:6px}
  #search{
    flex:1;min-width:210px;padding:11px 16px;border-radius:10px;
    border:1px solid var(--line);background:#fff;font-size:14px;
    font-family:inherit;color:var(--ink);outline:none;
    box-shadow:0 1px 3px rgba(31,41,51,.05);transition:.2s;
  }
  #search:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,111,168,.13)}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{
    padding:9px 14px;border-radius:999px;border:1px solid var(--line);
    background:#fff;font-size:13px;color:var(--sub);cursor:pointer;
    transition:.18s;font-family:inherit;white-space:nowrap;
  }
  .chip:hover{border-color:#c3d2e0}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}

  /* ===== 区块标题 ===== */
  .section-title{
    font-size:15px;font-weight:600;margin:26px 0 14px;
    display:flex;align-items:center;gap:9px;
  }
  .section-title::before{
    content:'';width:4px;height:16px;border-radius:2px;background:var(--accent);
  }
  .section-title.teacher-title::before{background:var(--teacher)}
  .count{font-size:12.5px;font-weight:400;color:#9aa5b1}

  /* ===== 卡片网格 ===== */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:14px}

  .card{
    background:#fff;border:1px solid var(--line);border-radius:13px;
    padding:16px 17px 15px;box-shadow:0 1px 3px rgba(31,41,51,.05);
    transition:transform .18s,box-shadow .18s;break-inside:avoid;
  }
  .card:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(31,41,51,.1)}

  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .no{
    font-size:11px;color:#9aa5b1;background:#f3f6f9;border-radius:5px;
    padding:2px 6px;flex-shrink:0;line-height:1.5;
    font-variant-numeric:tabular-nums;
  }
  .name{font-size:16px;font-weight:600;letter-spacing:.3px;line-height:1.3}

  .phone{
    display:inline-block;font-size:14.5px;font-weight:600;
    color:var(--accent);text-decoration:none;letter-spacing:.5px;
    font-variant-numeric:tabular-nums;margin-bottom:2px;
  }
  .phone:hover{text-decoration:underline}
  .phone.none{color:#b6bec8;font-weight:400;font-size:13px;letter-spacing:0}
  .card.teacher .phone{color:var(--teacher)}
  .card.teacher .no{background:var(--teacher-soft);color:#b07d3f}

  .meta{
    display:flex;flex-direction:column;gap:6px;
    border-top:1px dashed #edf1f5;padding-top:11px;margin-top:11px;
  }
  .meta .row{display:flex;gap:8px;font-size:12.5px;line-height:1.55}
  .meta .k{color:#9aa5b1;flex-shrink:0;width:30px}
  .meta .v{color:#43505e;flex:1;word-break:break-word}
  .meta .v.muted{color:#b6bec8}

  /* 老师科目徽章 */
  .subject-badge{
    display:inline-block;font-size:12px;font-weight:600;
    color:#b07d3f;background:var(--teacher-soft);
    border:1px solid #f0e2cc;border-radius:6px;
    padding:2px 9px;letter-spacing:.5px;
  }

  .card.pending{background:#fafbfc;border-style:dashed}
  .card.pending .name{color:#8b95a3;font-weight:500}

  .empty{text-align:center;color:#9aa5b1;font-size:13.5px;padding:34px 0}

  .foot{
    margin-top:40px;text-align:center;font-size:12px;color:#9aa5b1;
    line-height:1.8;letter-spacing:.3px;
  }

  /* ===== 打印 ===== */
  @page{size:A4;margin:12mm}
  @media print{
    body{background:#fff;padding:0;font-size:12px}
    .page{max-width:none}
    .no-print{display:none!important}
    .hero{
      background:#fff;color:var(--ink);box-shadow:none;border-radius:0;
      border-bottom:2px solid var(--accent);padding:0 0 14px;margin-bottom:6px;
    }
    .hero h1{color:var(--ink)}
    .hero .sub{color:var(--sub)}
    .grid{grid-template-columns:repeat(3,1fr);gap:8px}
    .card{box-shadow:none;border:1px solid #dde3ea;padding:11px 12px;border-radius:9px}
    .card:hover{transform:none;box-shadow:none}
    .section-title{margin:16px 0 9px}
    .phone{color:#1f2933}
    .card.teacher .phone{color:#1f2933}
    .subject-badge{background:#f5f5f5;border-color:#e0e0e0;color:#333}
  }
  @media (max-width:600px){
    body{padding:14px 12px 40px}
    .hero{flex-direction:column;align-items:flex-start;padding:20px}
    .hero h1{font-size:19px}
    .grid{grid-template-columns:1fr;gap:10px}
  }
</style>
</head>
<body>

<div class="page">

    <div>
      <h1>龙岩二中高2006届8班</h1>

  const students = raw.map(r => ({
    no:r[0], name:r[1], phone:r[2], city:r[3], company:r[4], title:r[5]
  }));

  /* ========== 工具函数 ========== */
  const esc = s => String(s == null ? '' : s)
    .replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  const PROVINCES = ['福建','江苏','浙江','湖北','上海','北京','广东','江西','山东','四川','安徽','湖南'];
  function shortCity(c){
    if(!c) return '';
    let s = c.replace(/省|市/g,'');
    for(const p of PROVINCES){ if(s.startsWith(p)){ s = s.slice(p.length); break; } }
    return s || c.replace(/省|市/g,'');
  }

  function fmtPhone(p){
    if(!p) return '';
    const d = String(p).replace(/\D/g,'');
    return d.length === 11 ? d.slice(0,3) + ' ' + d.slice(3,7) + ' ' + d.slice(7) : p;
  }

  /* ========== 卡片生成 ========== */
  function teacherCard(t){
    const phone = t.phone
      ? `<a class="phone" href="tel:${esc(t.phone)}">${fmtPhone(t.phone)}</a>`
      : `<span class="phone none">电话待补充</span>`;

    const subject = t.subject
      ? `<div class="meta"><div class="row"><span class="k">科目</span><span class="v"><span class="subject-badge">${esc(t.subject)}</span></span></div></div>`
      : `<div class="meta"><div class="row"><span class="v muted">科目待补充</span></div></div>`;

    return `<article class="card teacher">
      <div class="card-head"><h3 class="name">${esc(t.name)}</h3></div>
      ${phone}
      ${subject}
    </article>`;
  }

  function studentCard(s){
    const pending = !s.phone && !s.city && !s.company;
    const no = String(s.no).padStart(2,'0');
    const phone = s.phone
      ? `<a class="phone" href="tel:${esc(s.phone)}">${fmtPhone(s.phone)}</a>`
      : `<span class="phone none">电话待补充</span>`;

    const rows = [];
    if(s.city)    rows.push(['城市', shortCity(s.city)]);
    if(s.company) rows.push(['单位', s.company]);
    if(s.title && !['无','-','—',''].includes(s.title)) rows.push(['职务', s.title]);

    const meta = rows.length
      ? `<div class="meta">${rows.map(([k,v]) =>
          `<div class="row"><span class="k">${k}</span><span class="v">${esc(v)}</span></div>`
        ).join('')}</div>`
      : `<div class="meta"><div class="row"><span class="v muted">信息待补充</span></div></div>`;

    return `<article class="card${pending ? ' pending' : ''}">
      <div class="card-head"><span class="no">${no}</span><h3 class="name">${esc(s.name)}</h3></div>
      ${phone}
      ${meta}
    </article>`;
  }

  /* ========== 状态 & 渲染 ========== */
  const state = { q:'', city:'全部' };

  const $tGrid   = document.getElementById('teacherGrid');
  const $sGrid   = document.getElementById('stuGrid');
  const $count   = document.getElementById('stuCount');
  const $empty   = document.getElementById('emptyTip');
  const $chips   = document.getElementById('chips');
  const $search  = document.getElementById('search');
  const $stat    = document.getElementById('stat');

  function render(){
    const q = state.q.trim().toLowerCase();

    /* 老师（姓名 / 电话 / 科目 均可搜） */
    const tList = teachers.filter(t =>
      !q || t.name.toLowerCase().includes(q) ||
      String(t.phone||'').includes(q) ||
      String(t.subject||'').toLowerCase().includes(q)
    );
    $tGrid.innerHTML = tList.map(teacherCard).join('');

    /* 同学 */
    const sList = students.filter(s => {
      if(state.city !== '全部' && shortCity(s.city) !== state.city) return false;
      if(!q) return true;
      return [s.name, s.phone, s.city, s.company, s.title]
        .join(' ').toLowerCase().includes(q);
    });
    $sGrid.innerHTML = sList.map(studentCard).join('');
    $count.textContent = '· ' + sList.length + ' 人';
    $empty.hidden = sList.length > 0;
  }

  function initChips(){
    const counts = {};
    students.forEach(s => {
      const c = shortCity(s.city);
      if(c) counts[c] = (counts[c] || 0) + 1;
    });
    const order = Object.keys(counts).sort((a,b) => counts[b] - counts[a]);
    const items = [['全部', students.length]].concat(order.map(c => [c, counts[c]]));

    $chips.innerHTML = items.map(([c,n]) =>
      `<button class="chip${c === '全部' ? ' on' : ''}" data-city="${esc(c)}">${esc(c)} ${n}</button>`
    ).join('');

    $chips.addEventListener('click', e => {
      const btn = e.target.closest('.chip');
      if(!btn) return;
      state.city = btn.dataset.city;
      $chips.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === btn));
      render();
    });
  }

  /* ========== 初始化 ========== */
  const filled = students.filter(s => s.phone).length;
  $stat.textContent = `共 ${students.length} 位同学 · ${teachers.length} 位老师`;
  $search.addEventListener('input', e => { state.q = e.target.value; render(); });

  initChips();
  render();
})();
</script>
</body>
</html>
